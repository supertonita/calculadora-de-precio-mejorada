<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Toñita - Sistema Empaque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #etiquetaPreview, #etiquetaPreview * { visibility: visible; }
            #etiquetaPreview {
                position: absolute; left: 0; top: 0;
                width: 30mm; height: 40mm;
                margin: 0; padding: 1mm;
                border: none !important;
                background: white;
            }
            #barcode { width: 38mm !important; height: 12mm !important; }
            #etiqNombre { font-size: 10pt !important; }
            #etiqInfo { font-size: 8pt !important; }
        }
        @page { size: 30mm 40mm; margin: 0; }
    </style>
</head>
<body class="bg-gray-100 p-2">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- Botón de Conexión Bluetooth -->
        <div class="bg-white p-2 rounded-lg shadow flex justify-between items-center">
            <span id="bluetoothStatus" class="text-sm font-bold text-red-600">⚠️ Impresora Desconectada</span>
            <button onclick="conectarBluetooth()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold active:scale-95">Conectar BT</button>
        </div>

        <!-- Pestañas -->
        <div class="flex bg-white rounded-lg shadow p-1 no-print">
            <button onclick="showTab('empaque')" id="btnEmpaque" class="flex-1 py-2 font-bold bg-green-600 text-white rounded">Empaque</button>
            <button onclick="showTab('admin')" id="btnAdmin" class="flex-1 py-2 font-bold text-gray-600">Admin</button>
        </div>

        <!-- Seccion Empaque -->
        <div id="empaqueTab" class="space-y-4">
            <select id="productoSelect" class="w-full text-lg p-4 border rounded-xl font-bold bg-white shadow-sm"></select>
            <input type="number" id="pesoInput" step="0.01" inputmode="decimal" class="w-full text-5xl text-center py-6 border-4 border-blue-500 rounded-2xl shadow-inner font-mono" placeholder="0.00 lb">
            <button onclick="generarEtiqueta()" class="w-full bg-green-600 text-white py-6 text-2xl font-black rounded-2xl shadow-lg active:scale-95 transition-all">IMPRIMIR</button>
            
            <div id="etiquetaPreview" class="bg-white p-2 border-2 border-dashed border-gray-300 rounded-xl text-center space-y-1">
                <p class="text-xs font-bold uppercase">Super Toñita</p>
                <p id="etiqNombre" class="text-lg font-black uppercase text-gray-800">-- Seleccione --</p>
                <div id="etiqInfo" class="flex justify-between px-2 text-sm font-bold text-gray-700">
                    <span id="etiqPeso">0.00 lb</span>
                    <span id="etiqPrecio">$0.00</span>
                </div>
                <div class="flex justify-center"><svg id="barcode"></svg></div>
            </div>
        </div>

        <!-- Seccion Admin -->
        <div id="adminTab" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow space-y-2">
                <input type="hidden" id="editId">
                <input type="text" id="newId" placeholder="ID (ej. 01)" class="w-full p-3 border rounded">
                <input type="text" id="newName" placeholder="Nombre (ej. Muslo)" class="w-full p-3 border rounded">
                <input type="number" step="0.01" id="newPrice" placeholder="Precio x lb" class="w-full p-3 border rounded">
                <button id="saveBtn" onclick="guardarProductoFB()" class="w-full bg-blue-600 text-white py-3 rounded font-bold">Guardar Producto</button>
                <button id="cancelBtn" onclick="resetForm()" class="hidden w-full bg-gray-400 text-white py-3 rounded font-bold">Cancelar Edición</button>
            </div>
            <div id="adminTable" class="space-y-2"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkX2gQFitrzWKsaWRA8fUgFPSpJg0TIpQ",
            authDomain: "calculadora-de-peso-dc391.firebaseapp.com",
            projectId: "calculadora-de-peso-dc391",
            storageBucket: "calculadora-de-peso-dc391.firebasestorage.app",
            messagingSenderId: "641391345367",
            appId: "1:641391345367:web:47beba850a9d6d9fc93a92",
            measurementId: "G-WLZW3QET8M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db; window.collection = collection;
        window.addDoc = addDoc; window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc; window.doc = doc;

        onSnapshot(collection(db, "productos"), (snapshot) => {
            const select = document.getElementById('productoSelect');
            const container = document.getElementById('adminTable');
            select.innerHTML = ''; container.innerHTML = '';
            window.productosCache = [];
            
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                window.productosCache.push({ ...p, fbId: docSnap.id });
                
                let opt = document.createElement('option');
                opt.value = p.id; opt.textContent = `${p.nombre} ($${p.precioLibra.toFixed(2)})`;
                select.appendChild(opt);

                container.innerHTML += `
                    <div class='bg-white p-3 rounded shadow-sm flex justify-between items-center'>
                        <span><strong>${p.nombre}</strong> ($${p.precioLibra.toFixed(2)})</span>
                        <div class='space-x-2'>
                            <button onclick="editarProducto('${docSnap.id}')" class='bg-yellow-500 text-white px-3 py-1 rounded font-bold'>Edit</button>
                            <button onclick="eliminarProducto('${docSnap.id}')" class='bg-red-500 text-white px-3 py-1 rounded font-bold'>Del</button>
                        </div>
                    </div>`;
            });

            actualizarPreview();
        });
    </script>

    <script>
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        async function conectarBluetooth() {
            try {
                const statusLabel = document.getElementById('bluetoothStatus');
                statusLabel.innerText = "⏳ Conectando...";
                statusLabel.className = "text-sm font-bold text-yellow-600";

                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                bluetoothCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

                statusLabel.innerText = "✅ Impresora Conectada";
                statusLabel.className = "text-sm font-bold text-green-600";
            } catch (error) {
                console.error(error);
                const statusLabel = document.getElementById('bluetoothStatus');
                statusLabel.innerText = "❌ Error de conexión";
                statusLabel.className = "text-sm font-bold text-red-600";
                alert('No se pudo conectar: ' + error.message);
            }
        }

        function showTab(tab) {
            document.getElementById('empaqueTab').classList.toggle('hidden', tab !== 'empaque');
            document.getElementById('adminTab').classList.toggle('hidden', tab !== 'admin');
            document.getElementById('btnEmpaque').className = tab === 'empaque' ? "flex-1 py-2 font-bold bg-green-600 text-white rounded" : "flex-1 py-2 font-bold text-gray-600";
            document.getElementById('btnAdmin').className = tab === 'admin' ? "flex-1 py-2 font-bold bg-green-600 text-white rounded" : "flex-1 py-2 font-bold text-gray-600";
        }

        async function guardarProductoFB() {
            const fbId = document.getElementById('editId').value;
            const data = {
                id: document.getElementById('newId').value,
                nombre: document.getElementById('newName').value,
                precioLibra: parseFloat(document.getElementById('newPrice').value)
            };

            if (!data.id || !data.nombre || !data.precioLibra) {
                alert("Completa todos los campos");
                return;
            }

            if (fbId) {
                await window.updateDoc(window.doc(window.db, "productos", fbId), data);
                alert("Producto actualizado");
            } else {
                await window.addDoc(window.collection(window.db, "productos"), data);
                alert("Producto guardado");
            }
            resetForm();
        }

        function editarProducto(fbId) {
            const p = window.productosCache.find(x => x.fbId === fbId);
            document.getElementById('editId').value = fbId;
            document.getElementById('newId').value = p.id;
            document.getElementById('newName').value = p.nombre;
            document.getElementById('newPrice').value = p.precioLibra;
            document.getElementById('saveBtn').innerText = "Actualizar Producto";
            document.getElementById('cancelBtn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('newId').value = '';
            document.getElementById('newName').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('saveBtn').innerText = "Guardar Producto";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        async function eliminarProducto(fbId) {
            if(confirm("¿Seguro que deseas eliminar este producto?")) {
                await window.deleteDoc(window.doc(window.db, "productos", fbId));
            }
        }

        function redondearA5Centavos(monto) {
            return Math.round(monto * 20) / 20;
        }

        function actualizarPreview() {
            if (!window.productosCache) return;
            
            const selectVal = document.getElementById('productoSelect').value;
            const p = window.productosCache.find(x => x.id === selectVal);
            const peso = parseFloat(document.getElementById('pesoInput').value) || 0;

            if (!p) {
                document.getElementById('etiqNombre').innerText = "-- Seleccione --";
                document.getElementById('etiqPeso').innerText = "0.00 lb";
                document.getElementById('etiqPrecio').innerText = "$0.00";
                return;
            }

            const totalBruto = peso * p.precioLibra;
            const totalAjustado = redondearA5Centavos(totalBruto);

            const pesoStr = Math.round(peso * 100).toString().padStart(4, '0');
            const codigoFinal = `${p.id}${pesoStr}`;

            document.getElementById('etiqNombre').innerText = p.nombre;
            document.getElementById('etiqPeso').innerText = `${peso.toFixed(2)} lb`;
            document.getElementById('etiqPrecio').innerText = `$${totalAjustado.toFixed(2)}`;
            
            JsBarcode("#barcode", codigoFinal, { 
                format: "CODE128", 
                width: 2, 
                height: 40, 
                displayValue: true,
                fontSize: 12,
                margin: 0
            });
        }

        document.getElementById('pesoInput').addEventListener('input', actualizarPreview);
        document.getElementById('productoSelect').addEventListener('change', actualizarPreview);

        async function generarEtiqueta() {
            const p = window.productosCache.find(x => x.id === document.getElementById('productoSelect').value);
            const peso = parseFloat(document.getElementById('pesoInput').value);
            
            if (!p || !peso || peso <= 0) {
                alert("Selecciona un producto y escribe un peso válido");
                return;
            }

            actualizarPreview();

            if (bluetoothCharacteristic) {
                try {
                    // Creamos un canvas con el ancho exacto optimizado (384 puntos)
                    const canvas = document.createElement('canvas');
                    canvas.width = 384; 
                    canvas.height = 320; 
                    const ctx = canvas.getContext('2d');
                    
                    // Fondo completamente blanco
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Estilos de texto nítidos
                    ctx.fillStyle = "#000000";
                    ctx.font = "bold 22px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText("SUPER TOÑITA", canvas.width / 2, 40);

                    ctx.font = "bold 28px Arial";
                    ctx.fillText(p.nombre.toUpperCase(), canvas.width / 2, 80);

                    ctx.font = "bold 22px Arial";
                    ctx.textAlign = "left";
                    ctx.fillText(`PESO: ${peso.toFixed(2)} lb`, 30, 125);

                    const totalBruto = peso * p.precioLibra;
                    const totalAjustado = redondearA5Centavos(totalBruto);
                    ctx.textAlign = "right";
                    ctx.fillText(`TOTAL: $${totalAjustado.toFixed(2)}`, canvas.width - 30, 125);

                    // Insertar el código de barras SVG generado
                    const svgElement = document.getElementById('barcode');
                    const svgString = new XMLSerializer().serializeToString(svgElement);
                    const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                    const URL = window.URL || window.webkitURL || window;
                    const blobURL = URL.createObjectURL(svgBlob);
                    
                    await new Promise((resolve) => {
                        const img = new Image();
                        img.onload = function () {
                            ctx.drawImage(img, (canvas.width - 300) / 2, 145, 300, 110);
                            URL.revokeObjectURL(blobURL);
                            resolve();
                        };
                        img.src = blobURL;
                    });

                    // Traducir los pixeles del canvas a formato de matriz de puntos compatible por líneas
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const width = canvas.width;
                    const height = canvas.height;
                    const bytesWidth = width / 8; // 48 bytes
                    
                    let rasterBytes = [];
                    // Inicializar impresora (ESC @)
                    rasterBytes.push(0x1B, 0x40); 
                    // Centrar (ESC a 1)
                    rasterBytes.push(0x1B, 0x61, 0x01);

                    // Comando raster GS v 0 para imprimir mapa de bits por bloques limpios
                    rasterBytes.push(0x1D, 0x76, 0x30, 0x00);
                    rasterBytes.push(bytesWidth & 0xFF, (bytesWidth >> 8) & 0xFF);
                    rasterBytes.push(height & 0xFF, (height >> 8) & 0xFF);

                    for (let y = 0; y < height; y++) {
                        for (let xBytes = 0; xBytes < bytesWidth; xBytes++) {
                            let byte = 0;
                            for (let bit = 0; bit < 8; bit++) {
                                const x = xBytes * 8 + bit;
                                const idx = (y * width + x) * 4;
                                const r = imgData.data[idx];
                                const g = imgData.data[idx + 1];
                                const b = imgData.data[idx + 2];
                                // Si el pixel es oscuro, encendemos el bit
                                if ((r + g + b) / 3 < 130) {
                                    byte |= (1 << (7 - bit));
                                }
                            }
                            rasterBytes.push(byte);
                        }
                    }

                    // Comando para avanzar y expulsar la etiqueta correctamente
                    rasterBytes.push(0x1B, 0x64, 0x04);

                    // Enviar por bloques estables para que la P2 no sature su buffer Bluetooth
                    const CHUNK_SIZE = 512;
                    const dataArray = new Uint8Array(rasterBytes);
                    for (let i = 0; i < dataArray.length; i += CHUNK_SIZE) {
                        const chunk = dataArray.slice(i, i + CHUNK_SIZE);
                        await bluetoothCharacteristic.writeValue(chunk);
                    }

                } catch (error) {
                    console.error("Error al imprimir gráfico en P2:", error);
                    alert("Error al enviar la etiqueta gráfica. Reconecta el Bluetooth.");
                }
            } else {
                window.print();
            }

            document.getElementById('pesoInput').value = '';
            actualizarPreview();
            document.getElementById('pesoInput').focus();
        }
    </script>
</body>
</html>
